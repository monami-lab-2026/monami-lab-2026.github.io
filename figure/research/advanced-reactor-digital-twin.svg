<style>
.flow{animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-38}}
.salt{animation:salt 1.8s linear infinite}
@keyframes salt{to{stroke-dashoffset:-52}}
.spin{transform-box:view-box;animation:spin 5s linear infinite}
.swirl{transform-box:view-box;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.ripple{animation:ripple 3s ease-in-out infinite}
@keyframes ripple{50%{opacity:.62}}
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(10px)}}
.spr{animation:spr 2.2s ease-out infinite}
@keyframes spr{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(-26px,-46px)}}
.jet{animation:jet 1.1s ease-in-out infinite alternate}
@keyframes jet{to{transform:translateY(-9px)}}
.gpu{transform-box:fill-box;transform-origin:left center;animation:gpu 1.6s ease-in-out infinite alternate}
@keyframes gpu{from{transform:scaleX(.25)}to{transform:scaleX(1)}}
.draw{stroke-dasharray:900;animation:draw 5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:900}55%,100%{stroke-dashoffset:0}}
.blink{animation:blink 2.8s ease-in-out infinite}
@keyframes blink{50%{stroke-opacity:.7}}
.pop{animation:pop 4.4s ease-out infinite}
@keyframes pop{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
